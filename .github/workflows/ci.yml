name: Reproducibility and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cases:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18.x, 20.x, 22.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:cases

  vitest:
    runs-on: ubuntu-latest
    env:
      AGRONOMIC_DB_TESTS: '0'
      SOIL_HEALTH_DB_TESTS: '0'
      SOIL_HEALTH_PRIVATE_FIXTURE: '0'
      NDVI_NITROGEN_AI_EXPLANATION: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: geo-service/requirements.txt
      - run: python -m pip install -r geo-service/requirements.txt
      - run: npm ci
      - name: Run offline Vitest suites (no DB or live service credentials)
        run: npm test
      - run: npm run check

  pytest:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: geo-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run offline geospatial tests with coverage
        run: python -m pytest tests/ --cov=services --cov=utils --cov-report=term-missing
