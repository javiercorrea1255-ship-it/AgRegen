<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · AgRegen</title>
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(180deg, #15803d 0%, #0c5629 100%);
        color: #f8fafc;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      main {
        max-width: 28rem;
        width: 100%;
        background: rgba(15, 23, 42, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p { margin: 0.25rem 0; opacity: 0.92; line-height: 1.55; }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.16);
        margin-bottom: 1rem;
        font-size: 28px;
      }
      button {
        margin-top: 1.5rem;
        appearance: none;
        border: 0;
        background: #ffffff;
        color: #15803d;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      button:active { transform: scale(0.98); }
      small { display: block; margin-top: 1rem; opacity: 0.7; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🌱</div>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar AgRegen ahora mismo.</p>
      <p>Verificá tu conexión a internet y volvé a intentar.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <small>AgRegen funciona mejor con conexión, pero podés volver a abrir la app cuando recuperes señal.</small>
    </main>
  </body>
</html>
